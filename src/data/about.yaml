bio:
  - >-
    I am a Marie Skłodowska-Curie Postdoctoral Fellow at the [CISPA Helmholtz Center for Information Security](https://cispa.de/en) and a visiting researcher at the [Technical University of Munich (TUM)](https://www.tum.de/en/),
    working in the [Reactive Systems Group](https://finkbeiner.groups.cispa.de/) led by [Bernd Finkbeiner](https://finkbeiner.groups.cispa.de/people/finkbeiner/).
    Before that, I completed my PhD in 2025 at the [Institute of Science and Technology Austria (ISTA)](https://ista.ac.at/en/home/) under [Tom Henzinger](https://pub.ist.ac.at/~tah/)'s supervision.

  - >-
    My research aims to help people build *dependable computer systems*.
    To this end, I develop theories and algorithms for formally specifying requirements and verifying systems against them.

  - >-
    A central motivation for my work is ensuring that these systems align with *societal expectations* such as privacy, fairness, and explainability.
    This is hard because these expectations often require reasoning about how multiple executions of a system relate to one another.
    Moreover, two systems may both satisfy the same requirements and still differ greatly in quality.

  - >-
    I work toward a unified framework for efficiently measuring *how well* systems satisfy such relational requirements, known as hyperproperties.
    In my MSCA Postdoctoral Fellowship project [QHyperSTAR](https://cordis.europa.eu/project/id/101276381), I am laying the foundations for this framework by advancing the theory of quantitative hyperproperties and developing memory-efficient algorithms for monitoring them at runtime.

