intro:
  - >-
    I co-supervise Bachelor's and Master's theses at
    TUM on topics related to [my
    research](/research/), with projects ranging from mathematical
    foundations to tool development.
  - >-
    If you're interested, please [email me](mailto:ege.sarac@cispa.de) with a
    few sentences about what you'd like to explore, and we can find a
    direction together.

